# GERADO por scripts/nginxRoutes.ts a partir de scripts/simulationRoutes.ts — não edite à mão.
# Regenere com `npm run nginx-routes`; o teste scripts/__tests__/nginxRoutes.test.ts
# reprova se este arquivo divergir da lista.
map $uri $rota_de_simulacao_permitida {
    default 0;
    "~^/simulation-api/v1/engines$" 1;
    "~^/simulation-api/v1/weather$" 1;
    "~^/simulation-api/v1/models$" 1;
    "~^/simulation-api/v1/simulations$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/cancel$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/logs$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/artifacts$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/artifacts/(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._-]*$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/results/summary$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/results/errors$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/results/variables$" 1;
    "~^/simulation-api/v1/simulations/sim_[0-7][0-9A-HJKMNP-TV-Z]{25}/results/timeseries$" 1;
    "~^/simulation-api/v1/studies$" 1;
    "~^/simulation-api/v1/studies/std_[0-7][0-9A-HJKMNP-TV-Z]{25}$" 1;
    "~^/simulation-api/v1/studies/std_[0-7][0-9A-HJKMNP-TV-Z]{25}/cancel$" 1;
    "~^/simulation-api/v1/studies/std_[0-7][0-9A-HJKMNP-TV-Z]{25}/runs$" 1;
    "~^/simulation-api/v1/studies/std_[0-7][0-9A-HJKMNP-TV-Z]{25}/results$" 1;
}
