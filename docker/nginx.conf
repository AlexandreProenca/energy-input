# Serves the built static SPA (frontend-only, no backend). One server block,
# HTTP only — put TLS/a real domain in front of this via a reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Sem isto o nginx NUNCA comprime resposta vinda de proxy, mesmo com
    # application/json já listado abaixo. As páginas de série temporal da API chegam a
    # ~1 MB de JSON e comprimem perto de 10:1.
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
        application/xml text/javascript image/svg+xml font/woff2;

    # Basic hardening headers for a purely static, no-cookie app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The EnergyPlus schema files are versioned by folder name, not fingerprinted,
    # so cache them for a while but let clients revalidate.
    location /schema/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated, otherwise browsers/CDNs could keep
    # serving an old shell that references assets from a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Auth is supplied per browser session in production; no shared API secret.
    #
    # Este `location` é de PREFIXO: ele repassa qualquer sub-rota e query string sob
    # /simulation-api/v1/. O allowlist de `scripts/simulationRoutes.ts` é controle
    # exclusivo do `npm run dev` — aqui a autorização é a do próprio serviço. Produção é,
    # portanto, mais permissiva que o desenvolvimento. A assimetria é deliberada: não
    # "sincronize" os dois apagando o allowlist.
    location /simulation-api/v1/ {
        client_max_body_size 50m;
        proxy_pass https://homolog.ee.dev.br/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # O padrão do nginx é 1, e a cadeia da API tem três níveis até a raiz confiável
        # (folha → Let's Encrypt YE2 → ISRG Root YE, com cross-sign da ISRG Root X2). Com o
        # padrão, TODA chamada a /simulation-api virava 502 com "unable to get local issuer
        # certificate", enquanto o openssl no mesmo contêiner verificava a mesma cadeia sem
        # reclamar — porque ele não tem esse limite. Não confunda com bundle de CA
        # desatualizado: o bundle está correto.
        proxy_ssl_verify_depth 3;
        proxy_set_header Host homolog.ee.dev.br;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";

        # O padrão do nginx para upstream é HTTP/1.0, o que fecha a conexão a cada
        # pedido. O painel de resultados dispara várias consultas de série seguidas e
        # pagaria um handshake TLS em cada uma.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Uma página de série cabe em memória com isto; com o padrão (4k/8k) o nginx
        # derrama cada resposta em disco, em proxy_temp_path.
        proxy_buffer_size 32k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        # A primeira consulta de série de uma simulação prepara um índice sobre o
        # eplusout.sql do lado do serviço e pode demorar mais que os 60 s anteriores.
        proxy_read_timeout 120s;

        proxy_intercept_errors on;
        error_page 302 = @simulation_download;
        add_header Cache-Control "no-store" always;
    }

    # Return a short-lived download link, so Authorization never goes to storage.
    location @simulation_download {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"download_url":"$upstream_http_location"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
