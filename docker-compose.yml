services:
  web:
    build: .
    # Só no próprio computador por padrão. O contêiner não guarda credencial desde a T032
    # (ADR-0004) — cada pessoa entra com a própria conta —, então publicar em outro endereço é
    # decisão de implantação, com TLS na frente: o cookie de sessão é `Secure`.
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

