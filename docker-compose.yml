services:
  web:
    build: .
    # Só no próprio computador: a chave da API é injetada pelo proxy do contêiner, e quem
    # alcançasse a porta usaria a conta do dono da chave (ADR-0003).
    ports:
      - "127.0.0.1:8080:80"
    # A mesma chave do `npm run dev`. Opcional: sem o arquivo, o contêiner sobe e o serviço
    # de simulação responde 401.
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped

