name: Revisão por IA no PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisão Técnica (DeepSeek)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout do head do PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reunir contexto e diff relevantes
        id: contexto
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" || true

          # Coleta lista de arquivos alterados excluindo lockfiles e builds gerados
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -v -E '^(package-lock\.json|dist/|public/schema/)' > arquivos-alterados.txt || true

          # Coleta o diff excluindo ruídos de lockfile e schemas compilados
          git diff --no-ext-diff --no-textconv --no-color "$BASE_SHA"..."$HEAD_SHA" -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)dist/**' \
            ':(exclude)public/schema/**' > pr.diff || true

          DIFF_BYTES=$(wc -c < pr.diff | tr -d ' ')
          echo "diff_bytes=$DIFF_BYTES" >> "$GITHUB_OUTPUT"

          # Limita o diff a ~70KB para não estourar a janela de contexto
          if [ "$DIFF_BYTES" -gt 70000 ]; then
            head -c 70000 pr.diff > pr.diff.truncated
            mv pr.diff.truncated pr.diff
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

          # Monta arquivo de contexto com PRD e notas de desenvolvimento
          {
            echo "# Contexto do Repositório: Energy Input"
            echo
            if [ -f "docs/PRD.md" ]; then
              echo "## PRD (Objetivos e Requisitos)"
              head -n 120 docs/PRD.md
              echo
            fi
            if [ -f "docs/DEVELOPMENT.md" ]; then
              echo "## Notas Técnicas e Arquitetura"
              head -n 100 docs/DEVELOPMENT.md
              echo
            fi
            if [ -f "MEMORY.md" ]; then
              echo "## Decisões e Armadilhas Conhecidas (MEMORY.md)"
              cat MEMORY.md
              echo
            fi
            if [ -d "docs/adr" ]; then
              echo "## Decisões de Arquitetura Registradas (ADRs)"
              ls -la docs/adr/*.md 2>/dev/null || true
            fi
          } > contexto.md

          {
            echo "Arquivos alterados no PR: $(wc -l < arquivos-alterados.txt | tr -d ' ')"
            echo "Diff avaliado: $(wc -c < pr.diff | tr -d ' ') bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decidir se revisa
        id: preflight
        env:
          DIFF_BYTES: ${{ steps.contexto.outputs.diff_bytes }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY não configurado; revisão por IA ignorada."
            echo "Revisão por IA ignorada: secret \`DEEPSEEK_API_KEY\` ausente." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$DIFF_BYTES" = "0" ]; then
            echo "Sem alterações de código relevantes para revisar." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar revisão com DeepSeek
        if: steps.preflight.outputs.run == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TRUNCATED: ${{ steps.contexto.outputs.truncated }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          with open("pr.diff", "r", encoding="utf-8", errors="replace") as fh:
              diff = fh.read()

          with open("contexto.md", "r", encoding="utf-8", errors="replace") as fh:
              contexto = fh.read().strip()

          with open("arquivos-alterados.txt", "r", encoding="utf-8", errors="replace") as fh:
              arquivos_alterados = {linha.rstrip("\n") for linha in fh if linha.rstrip("\n")}

          truncated_note = (
              "\n\n[Atenção: O diff foi truncado por tamanho. Avalie com base no trecho exibido.]"
              if os.environ.get("TRUNCATED") == "true"
              else ""
          )
          lista_de_arquivos = "".join(f"- {item}\n" for item in sorted(arquivos_alterados))

          system_prompt = (
              "Você é um revisor de código sênior especialista em TypeScript, React, Three.js "
              "e física de edifícios (EnergyPlus epJSON).\n"
              "O projeto 'Energy Input' é uma SPA web para criação, validação e edição paramétrica "
              "de arquivos epJSON para o motor EnergyPlus, com visualizador 3D e planta 2D.\n\n"
              "Analise causa e efeito no diff. Só reporte defeitos demonstráveis e objetivos: cada "
              "achado precisa de cenário de falha claro, evidência no diff e um teste para comprovar.\n\n"
              "Priorize rigidamente:\n"
              "1. ISOLAMENTO DE src/core/: Esta pasta DEVE ser 100% pura (framework-free). Não pode "
              "importar React, hooks, Zustand, Three.js ou objetos do DOM (window/document).\n"
              "2. CONFORMIDADE COM epJSON: Nomes de campos em snake_case, tipos corretos (números, "
              "arrays de vértices, extensões, enums válidos do schema), chaves de 'object-list' válidas.\n"
              "3. GEOMETRIA E SUPERFÍCIES COMPARTILHADAS (sharedSurfaces.ts / floorPlan.ts): Cálculo de polígonos, "
              "tolerâncias (0.1 mm), pareamento mútuo e inversão de camadas em paredes/lajes entre zonas.\n"
              "4. INTEGRIDADE DE DADOS E SINCRONIZAÇÃO (planWizardSync): Nunca sobrescrever edições manuais "
              "silenciosamente sem acionar diálogo de conflito; manter integridade referencial ao renomear objetos.\n"
              "5. SEGURANÇA E SEGREDO: Credenciais (ex: SIMULATION_API_TOKEN) NUNCA devem entrar no bundle "
              "(sem prefixo VITE_ para segredos) nem em localStorage. Dados enviados à API de homologação "
              "devem ser sanitizados.\n"
              "6. TIPAGEM E CORRETUDE REACT/ZUSTAND: Sem 'any' injustificado, sem loops de re-render, sem "
              "descarte incorreto de recursos WebGL/Three.js (memory leaks).\n"
              "7. LACUNAS DE TESTE: Alterações em lógica de domínio (core/, generators/, validation/) "
              "devem possuir testes unitários no Vitest.\n\n"
              "Responda SOMENTE com um JSON nesta estrutura exata:\n"
              "{\"findings\":[{\"severity\":\"critical|high|medium|low\",\"confidence\":0.0,"
              "\"path\":\"arquivo\",\"line\":1,\"title\":\"título curto\",\"failure_scenario\":\"como falha\","
              "\"evidence\":\"evidência concreta\",\"suggested_test\":\"teste demonstrativo\"}],"
              "\"summary\":\"conclusão concisa\"}. Use findings=[] quando não houver defeitos."
          )

          user_prompt = (
              f"<contexto_do_projeto>\n{contexto}\n</contexto_do_projeto>\n\n"
              f"<pr_info>\n"
              f"Título: {os.environ.get('PR_TITLE', '')}\n"
              f"Descrição:\n{os.environ.get('PR_BODY', '') or '(sem descrição)'}\n\n"
              f"Arquivos alterados:\n{lista_de_arquivos}\n"
              f"Diff:\n{diff}{truncated_note}\n"
              f"</pr_info>\n\n"
              "Revise as alterações conforme o contrato estabelecido. Retorne apenas o JSON especificado."
          )

          payload = {
              "model": "deepseek-chat",
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
              "temperature": 0.2,
              "response_format": {"type": "json_object"},
              "max_tokens": 3500,
          }

          req = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['DEEPSEEK_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  body = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:
              print(f"::error::Falha na comunicação com a API DeepSeek: {exc}", file=sys.stderr)
              sys.exit(1)

          def extrair_json(texto):
              """Primeiro objeto JSON do texto, ignorando o que vier antes e depois.

              `json.loads` exige que a string inteira seja um documento só, e o modelo às
              vezes acrescenta comentário depois do objeto — o erro era
              `Extra data: line 3 column 1`. `raw_decode` lê o primeiro documento e informa
              onde ele terminou: o resto é conversa, não dado.

              Percorre **todas** as chaves de abertura, e não só a primeira, porque prosa do
              tipo `use {chaves} assim` antes do objeto faria a primeira apontar para lixo.
              E exige `dict`: uma resposta como `[1,2,3]` decodifica sem erro, e o
              `.get("findings")` seguinte levantaria `AttributeError` — falha correta pela
              razão errada, com mensagem que não ajuda quem for diagnosticar.
              """
              texto = texto.strip()
              # A cerca é removida por conveniência; quem de fato sustenta os casos
              # estranhos é a varredura de chaves abaixo.
              if texto.startswith("```"):
                  texto = re.sub(r"^```\s*[a-zA-Z]*\s*", "", texto)
                  texto = re.sub(r"\s*```$", "", texto).strip()
              decoder = json.JSONDecoder()
              inicio = texto.find("{")
              while inicio != -1:
                  try:
                      obj, _ = decoder.raw_decode(texto[inicio:])
                      if isinstance(obj, dict):
                          return obj
                  except ValueError:
                      pass
                  inicio = texto.find("{", inicio + 1)
              raise ValueError("nenhum objeto JSON na resposta")

          try:
              content = body["choices"][0]["message"]["content"].strip()
              review = extrair_json(content)
              findings = review.get("findings", [])
              summary = review.get("summary", "")
          except Exception as exc:
              # A resposta vai para o log: sem ela, diagnosticar o próximo formato inesperado
              # exige reproduzir a chamada à mão.
              print(f"::error::Resposta do modelo em formato inválido: {exc}", file=sys.stderr)
              # O log do CI é público neste repositório, e a resposta deriva do diff do
              # PR. O começo e o tamanho bastam para identificar um problema de formato;
              # despejar o corpo inteiro exporia mais do que o diagnóstico exige.
              bruto = body.get("choices", [{}])[0].get("message", {}).get("content") or ""
              print(f"--- resposta recebida ({len(bruto)} caracteres), primeiros 300 ---", file=sys.stderr)
              print(bruto[:300], file=sys.stderr)
              sys.exit(1)

          severidades = {
              "critical": "CRÍTICA",
              "high": "ALTA",
              "medium": "MÉDIA",
              "low": "BAIXA",
          }

          blocos = []
          for f in findings[:5]:
              sev = severidades.get(f.get("severity", "low"), "BAIXA")
              conf = f.get("confidence", 0.0)
              path = f.get("path", "")
              line = f.get("line", 1)
              title = f.get("title", "")
              failure = f.get("failure_scenario", "")
              evidence = f.get("evidence", "")
              test = f.get("suggested_test", "")
              blocos.append(
                  f"### [{sev}] {title}\n\n"
                  f"`{path}:{line}` · confiança: {conf:.0%}\n\n"
                  f"**Cenário de falha:** {failure}\n\n"
                  f"**Evidência:** {evidence}\n\n"
                  f"**Teste sugerido:** {test}"
              )

          if blocos:
              rendered = "\n\n".join(blocos) + f"\n\n### Resumo da Análise\n\n{summary.strip()}"
          else:
              rendered = summary.strip() or "Nenhum defeito demonstrável ou risco crítico encontrado nas alterações avaliadas."

          with open("review.md", "w", encoding="utf-8") as fh:
              fh.write(rendered + "\n")
          PY

      - name: Publicar relatório de revisão no PR
        if: steps.preflight.outputs.run == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "<!-- ai-pr-review -->"
            echo "## Revisão Técnica por IA (Energy Input)"
            echo
            cat review.md
            echo
            echo "---"
            echo "_Análise automatizada para o commit \`${HEAD_SHA:0:7}\`. A revisão humana continua soberana e obrigatória._"
          } > comment.md

          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          # Cria ou edita o comentário existente do bot no PR
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md --edit-last \
            || gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
