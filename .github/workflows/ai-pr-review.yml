name: Revisão por IA no PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisão Técnica (DeepSeek)
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout do head do PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reunir contexto e diff relevantes
        id: contexto
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" || true

          # Coleta lista de arquivos alterados excluindo lockfiles e builds gerados
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -v -E '^(package-lock\.json|dist/|public/schema/)' > arquivos-alterados.txt || true

          # Coleta o diff excluindo ruídos de lockfile e schemas compilados
          git diff --no-ext-diff --no-textconv --no-color "$BASE_SHA"..."$HEAD_SHA" -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)dist/**' \
            ':(exclude)public/schema/**' > pr.diff || true

          DIFF_BYTES=$(wc -c < pr.diff | tr -d ' ')
          echo "diff_bytes=$DIFF_BYTES" >> "$GITHUB_OUTPUT"

          # Limita o diff a ~70KB para não estourar a janela de contexto
          if [ "$DIFF_BYTES" -gt 70000 ]; then
            head -c 70000 pr.diff > pr.diff.truncated
            mv pr.diff.truncated pr.diff
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

          # Monta arquivo de contexto com PRD e notas de desenvolvimento
          {
            echo "# Contexto do Repositório: Energy Input"
            echo
            if [ -f "docs/PRD.md" ]; then
              echo "## PRD (Objetivos e Requisitos)"
              head -n 120 docs/PRD.md
              echo
            fi
            if [ -f "docs/DEVELOPMENT.md" ]; then
              echo "## Notas Técnicas e Arquitetura"
              head -n 100 docs/DEVELOPMENT.md
              echo
            fi
            if [ -f "MEMORY.md" ]; then
              echo "## Decisões e Armadilhas Conhecidas (MEMORY.md)"
              cat MEMORY.md
              echo
            fi
            if [ -d "docs/adr" ]; then
              echo "## Decisões de Arquitetura Registradas (ADRs)"
              ls -la docs/adr/*.md 2>/dev/null || true
            fi
          } > contexto.md

          {
            echo "Arquivos alterados no PR: $(wc -l < arquivos-alterados.txt | tr -d ' ')"
            echo "Diff avaliado: $(wc -c < pr.diff | tr -d ' ') bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decidir se revisa
        id: preflight
        env:
          DIFF_BYTES: ${{ steps.contexto.outputs.diff_bytes }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::warning::DEEPSEEK_API_KEY não configurado; revisão por IA ignorada."
            echo "Revisão por IA ignorada: secret \`DEEPSEEK_API_KEY\` ausente." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$DIFF_BYTES" = "0" ]; then
            echo "Sem alterações de código relevantes para revisar." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Só depois do preflight: PR sem alteração de código relevante não paga instalação.
      - name: Preparar Node
        if: steps.preflight.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        if: steps.preflight.outputs.run == 'true'
        run: npm ci

      - name: Executar revisão com DeepSeek
        if: steps.preflight.outputs.run == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TRUNCATED: ${{ steps.contexto.outputs.truncated }}
        run: |
          set -euo pipefail
          # A lógica vive em `scripts/aiReview/`, testada no Vitest como qualquer outro
          # módulo. Viveu três tarefas aqui dentro (T018, T019 e a revisão da T019), onde
          # nada a exercitava e só rodava com PR aberto — quando falhar bloqueia em vez de
          # avisar.
          npx tsx scripts/aiReview/run.ts

      - name: Publicar relatório de revisão no PR
        if: steps.preflight.outputs.run == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "<!-- ai-pr-review -->"
            echo "## Revisão Técnica por IA (Energy Input)"
            echo
            cat review.md
            echo
            echo "---"
            echo "_Análise automatizada para o commit \`${HEAD_SHA:0:7}\`. A revisão humana continua soberana e obrigatória._"
          } > comment.md

          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          # Cria ou edita o comentário existente do bot no PR
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md --edit-last \
            || gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
