name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verificar_origem:
    name: Verificar origem da ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recusar tag fora da main
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = tag ] || exit 0
          git fetch --no-tags origin main
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo 'a tag não aponta para um commit de main' >&2; exit 2
          }

  qualidade:
    name: Lint, tipos, testes e build
    needs: verificar_origem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar e validar schema
        run: npm run schema

      - name: Checagem estrita de tipos (TypeScript)
        run: npm run typecheck

      - name: Testes automatizados (Vitest)
        run: npm test

      - name: Build do bundle estático (Vite)
        run: npm run build

  docker_test:
    name: Validar container Docker
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t energy-input:local-test .

      - name: Testar inicialização e healthcheck do Nginx
        run: |
          set -euo pipefail
          docker run -d --name energy-input-ci -p 8080:80 energy-input:local-test
          
          # Aguarda o Nginx responder na porta 8080
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "Container respondendo em http://127.0.0.1:8080/"; exit 0
            fi
            sleep 1
          done
          echo "::error::O container Nginx não respondeu em 30 segundos."
          docker logs energy-input-ci
          exit 1

      - name: Limpar container
        if: always()
        run: docker rm -f energy-input-ci || true

  publicar_imagem:
    name: Publicar imagem no GHCR
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qualidade, docker_test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados e tags para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construir e publicar imagem multi-plataforma
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
