name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verificar_origem:
    name: Verificar origem da ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recusar tag fora da main
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = tag ] || exit 0
          git fetch --no-tags origin main
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo 'a tag não aponta para um commit de main' >&2; exit 2
          }

  qualidade:
    name: Lint, tipos, testes e build
    needs: verificar_origem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar e validar schema
        run: npm run schema

      - name: Checagem estrita de tipos (TypeScript)
        run: npm run typecheck

      - name: Testes automatizados (Vitest)
        run: npm test

      - name: Build do bundle estático (Vite)
        # Canário (T027): a chave da API vive em SIMULATION_API_TOKEN, no ambiente do servidor.
        # O build roda com um valor falso nessa variável — e em .env.local, que o Vite também
        # lê — e reprova se ele aparecer no bundle. O Vite só expõe variáveis `VITE_`, e é
        # exatamente essa garantia que este passo trava.
        env:
          SIMULATION_API_TOKEN: canario-da-chave-nao-pode-ir-para-o-bundle
        run: |
          set -euo pipefail
          echo "SIMULATION_API_TOKEN=canario-do-env-local-nao-pode-ir-para-o-bundle" > .env.local
          npm run build
          rm -f .env.local
          if grep -rl "canario-da-chave\|canario-do-env-local" dist/; then
            echo "::error::A chave da API foi parar no bundle. Nenhum segredo pode ter o prefixo VITE_."
            exit 1
          fi
          echo "Nenhum rastro da chave no bundle."

  docker_test:
    name: Validar container Docker
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t energy-input:local-test .

      - name: Testar inicialização e healthcheck do Nginx
        run: |
          set -euo pipefail
          docker run -d --name energy-input-ci -p 8080:80 energy-input:local-test

          # Aguarda o Nginx responder na porta 8080
          pronto=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              pronto=sim; break
            fi
            sleep 1
          done
          if [ -z "$pronto" ]; then
            echo "::error::O container Nginx não respondeu em 30 segundos."
            docker logs energy-input-ci
            exit 1
          fi
          echo "Container respondendo em http://127.0.0.1:8080/"

      - name: Verificar o proxy de simulação no contêiner
        run: |
          set -euo pipefail
          # Este passo existe porque o passo acima NÃO teria pego o defeito real que a T002
          # corrigiu: toda chamada a /simulation-api devolvia 502 por
          # `proxy_ssl_verify_depth` (padrão 1, cadeia de três níveis), e o healthcheck só
          # busca a página estática. Ficou verde durante todo o tempo em que o proxy estava
          # quebrado.
          #
          # Sem credencial, o serviço responde 401 — e 401 já prova o que interessa: o
          # handshake TLS com o upstream aconteceu. O portão NÃO é o código de status, e sim
          # a ausência do erro de verificação no log: um 502 por serviço fora do ar
          # reprovaria o CI por motivo alheio a este repositório.
          codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            http://127.0.0.1:8080/simulation-api/v1/engines || echo 000)"
          echo "GET /simulation-api/v1/engines -> HTTP $codigo"

          if docker logs energy-input-ci 2>&1 | grep -q "SSL certificate verify error"; then
            echo "::error::O nginx não verificou o certificado do upstream. Confira \`proxy_ssl_verify_depth\` e o bundle de CAs em docker/nginx.conf."
            docker logs energy-input-ci 2>&1 | grep -i "ssl" | tail -5
            exit 1
          fi

          # Sem chave, o serviço responde 401 — e só ele: o nginx nunca produz 401 por conta
          # própria. Qualquer outro código numa rota permitida quer dizer que o pedido não
          # chegou ao upstream: 404 seria o `proxy_pass` ignorado (a revisão do PR #24 apontou
          # que o passo aceitava qualquer código como sucesso), 403/405 uma recusa indevida.
          case "$codigo" in
            401) echo "O pedido permitido atravessou as recusas e chegou ao serviço, com TLS verificado." ;;
            502) echo "::warning::502 sem erro de verificação TLS no log — provável indisponibilidade do serviço, não regressão do proxy." ;;
            000) echo "::warning::Sem resposta do proxy; serviço possivelmente inacessível a partir do runner." ;;
            *) echo "::error::Rota permitida respondeu $codigo, e não 401: o pedido não chegou ao serviço."; exit 1 ;;
          esac

      - name: Verificar as defesas do proxy com a chave no servidor (T027)
        run: |
          set -euo pipefail
          # Com a chave da API injetada pelo nginx, o proxy precisa recusar o que o proxy de
          # desenvolvimento recusa: rota fora da lista, método fora de GET/POST, outra origem.
          # Estas recusas acontecem no nginx, antes do upstream — independem de o serviço de
          # simulação estar no ar, e por isso são portão, não aviso.
          c() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          SIM=sim_01M2KXB9D4TQ7F3S0YJ8N5VZQK
          falhou=0
          confere() { if [ "$2" != "$3" ]; then echo "::error::$1: esperado $3, veio $2"; falhou=1; else echo "ok  $1 -> $2"; fi; }
          confere "rota fora da lista"      "$(c http://127.0.0.1:8080/simulation-api/v1/api-keys)" 404
          confere "conteúdo de modelo"      "$(c http://127.0.0.1:8080/simulation-api/v1/models/mdl_01M2KXAZ9WQK8YT4N6P0R2S5V7/content)" 404
          confere "travessia no artefato"   "$(c --path-as-is http://127.0.0.1:8080/simulation-api/v1/simulations/$SIM/artifacts/..%2f..%2fetc%2fpasswd)" 404
          confere "método DELETE"           "$(c -X DELETE http://127.0.0.1:8080/simulation-api/v1/simulations/$SIM)" 405
          confere "pedido de outra origem"  "$(c -H 'Origin: http://evil.example' http://127.0.0.1:8080/simulation-api/v1/engines)" 403
          [ "$falhou" = 0 ]

          # A chave só vai para localhost e para os hosts declarados. Conferido na configuração
          # que o nginx carrega, porque o cabeçalho enviado ao upstream não é observável daqui.
          docker run -d --name energy-input-chave -e SIMULATION_API_TOKEN=canario-ci \
            -e SIMULATION_TOKEN_HOSTS=energia.exemplo energy-input:local-test >/dev/null
          sleep 3
          conf="$(docker exec energy-input-chave nginx -T 2>/dev/null)"
          echo "$conf" | grep -q '1 "Bearer canario-ci";' || { echo "::error::a chave não entrou no mapa de autorização"; exit 1; }
          echo "$conf" | grep -q 'energia.exemplo 1;' || { echo "::error::o host declarado não entrou no mapa"; exit 1; }
          echo "$conf" | grep -A3 'map $host $host_recebe_chave' | grep -q 'default 0;' || { echo "::error::host não declarado estaria recebendo a chave"; exit 1; }
          docker rm -f energy-input-chave >/dev/null

          # Chave com caractere que quebraria a configuração: o contêiner não sobe. Em segundo
          # plano e conferido pelo estado — em primeiro plano, um contêiner que subisse por
          # engano travaria o CI até estourar o tempo, em vez de reprovar.
          docker run -d --name energy-input-chave-ruim -e 'SIMULATION_API_TOKEN=abc";x' energy-input:local-test >/dev/null
          sleep 3
          if [ "$(docker inspect -f '{{.State.Running}}' energy-input-chave-ruim)" = true ]; then
            echo "::error::o contêiner subiu com uma chave que injeta configuração"; exit 1
          fi
          docker logs energy-input-chave-ruim 2>&1 | grep -q "caracteres fora" || { echo "::error::a recusa não explicou o motivo"; exit 1; }
          # `=` só vale no fim, como no b64token da RFC 6750.
          docker run -d --name energy-input-chave-igual -e 'SIMULATION_API_TOKEN=abc=def' energy-input:local-test >/dev/null
          sleep 3
          if [ "$(docker inspect -f '{{.State.Running}}' energy-input-chave-igual)" = true ]; then
            echo "::error::o contêiner aceitou '=' no meio da chave"; exit 1
          fi
          docker rm -f energy-input-chave-igual >/dev/null
          docker rm -f energy-input-chave-ruim >/dev/null
          echo "Defesas do proxy conferidas."

      - name: Limpar container
        if: always()
        run: docker rm -f energy-input-ci energy-input-chave energy-input-chave-ruim energy-input-chave-igual || true

  publicar_imagem:
    name: Publicar imagem no GHCR
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qualidade, docker_test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados e tags para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construir e publicar imagem multi-plataforma
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
